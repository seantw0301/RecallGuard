[project]
name = "recallguard"
version = "0.1.0"
description = "Counterfactual memory replay for personal AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
markers = ["live: calls real Nemotron via Nebius (needs .env, RUN_LIVE=1)"]
